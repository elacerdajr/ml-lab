# 2026-07-02_leaf_embedding_ranking: settings read by run_experiment.py

p_pos: 0.1

n_train: 2000

n_test: 2000

seed: 42

extractor_configs:
  heavy_reg: {depth: 3, iterations: 100, l2_leaf_reg: 100, random_strength: 10}
  light_reg: {depth: 4, iterations: 200, l2_leaf_reg: 1, random_strength: 1}

# 0.0 = no-perturbation control, 0.25 = over-perturbation demo
lambdas: [0.0, 0.05, 0.1, 0.25]

epsilon_tiebreak: 1.0e-06

logit_clip: 1.0e-06

std_floor: 1.0e-08

# fixed L2 strength — one-hot leaf embedding can have p >> n columns
alpha_ridge: 10.0

# GaussianPopulation arguments besides p_pos: class separation per feature, within-class std
population:
  info: {x1: 1.2, x2: 0.8, x3: 0.4, x4: 0.15, x5: 0.05}
  sigma: 1.0
